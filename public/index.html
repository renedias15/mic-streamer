<!DOCTYPE html>
<html>
<head>
<title>Live Audio Stream</title>
</head>
<body>

<h2>Live Audio Stream</h2>

<h3 id="network">Network: Detecting...</h3>

<button onclick="start()">Start Audio</button>

<script>

let socket
let audioContext

function start() {

    audioContext = new AudioContext()

    socket = new WebSocket("wss://" + location.host)

    socket.binaryType = "arraybuffer"

    socket.onopen = () => {

        console.log("WebSocket connected")

        socket.send("LISTENER")

    }

    socket.onmessage = (event) => {

        // Handle text messages first
        if (typeof event.data === "string") {
    
            if (event.data.startsWith("NETWORK:")) {
    
                const network = event.data.split(":")[1]
    
                document.getElementById("network").innerText =
                    "Network: " + network
    
                return
            }
    
        }
    
        // Audio handling (your original code)
    
        const pcmData = new Int16Array(event.data)
    
        const floatData = new Float32Array(pcmData.length)
    
        for (let i = 0; i < pcmData.length; i++) {
            floatData[i] = pcmData[i] / 32768
        }
    
        const buffer = audioContext.createBuffer(
            1,
            floatData.length,
            16000
        )
    
        buffer.copyToChannel(floatData, 0)
    
        const source = audioContext.createBufferSource()
    
        source.buffer = buffer
        source.connect(audioContext.destination)
    
        source.start()
    
    }

}

function updateNetwork() {

    const connection =
        navigator.connection ||
        navigator.mozConnection ||
        navigator.webkitConnection

    const label = document.getElementById("network")

    if (!connection) {
        label.innerText = "Network: Unknown (browser unsupported)"
        return
    }

    label.innerText = "Network Quality: " + connection.effectiveType

}

updateNetwork()

if (navigator.connection) {
    navigator.connection.addEventListener("change", updateNetwork)
}

</script>

</body>
